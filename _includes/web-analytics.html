<section id="analytics-consent" class="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <div class="analytics-copy">
    <h2 id="analytics-consent-title">사이트 개선을 위해 방문·설치 링크 클릭을 분석할까요?</h2>
    <p class="analytics-meta"><span>Google Analytics 사용</span><a href="{{ '/privacy/#website-analytics' | relative_url }}">자세히 보기</a></p>
  </div>
  <div class="analytics-actions">
    <button type="button" data-analytics-choice="denied">거부</button>
    <button type="button" data-analytics-choice="granted">허용</button>
  </div>
</section>
<script id="site-analytics" defer src="{{ '/assets/js/analytics.js' | relative_url }}" data-measurement-id="{{ site.ga4_measurement_id | escape }}" data-page-url="{{ page.url | absolute_url | escape }}" data-store-url="{{ site.app_store_url | escape }}"></script>
