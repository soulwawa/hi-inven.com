---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="page-kicker">{% if page.categories contains 'release' %}릴리스 노트{% else %}블로그{% endif %}</p>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <nav class="post-nav" aria-label="글 목록으로 돌아가기">
    {% if page.categories contains 'release' %}
      <a href="{{ '/release/' | relative_url }}">릴리스 목록</a>
    {% else %}
      <a href="{{ '/blog/' | relative_url }}">블로그 목록</a>
    {% endif %}
  </nav>
</article>
